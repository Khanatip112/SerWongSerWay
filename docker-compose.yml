services:
  postgres:
    image: postgres:16-alpine
    container_name: pastelpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pastelpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "exit 1"]
      interval: 5s
      timeout: 3s
      retries: 2
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pastelpulse-server
    restart: on-failure
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pastelpulse}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-pastelpulse_dev_session_secret_jwt}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pastelpulse-client
    restart: on-failure
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      - server

volumes:
  postgres_data:
