services:
  db:
    image: postgres:16-alpine
    container_name: pastelpulse-db
    restart: unless-stopped
    networks:
      - pastelpulse
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pastelpulse}
    ports:
      - "5434:5432"
    volumes:
      - pastelpulse_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pastelpulse}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pastelpulse-migrate
    restart: "no"
    networks:
      - pastelpulse
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pastelpulse}?schema=public
      CREATOR1_PASSWORD: ${CREATOR1_PASSWORD}
      CREATOR2_PASSWORD: ${CREATOR2_PASSWORD}
      RESPONDENT1_PASSWORD: ${RESPONDENT1_PASSWORD}
      RESPONDENT2_PASSWORD: ${RESPONDENT2_PASSWORD}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command: [ "sh", "-c", "npx prisma migrate deploy && npm run db:seed" ]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pastelpulse-server
    restart: unless-stopped
    networks:
      - pastelpulse
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Bangkok
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "3000:3000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: pastelpulse-client
    restart: unless-stopped
    networks:
      - pastelpulse
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  pastelpulse_data:
    name: pastelpulse_data

networks:
  pastelpulse:
    name: pastelpulse
